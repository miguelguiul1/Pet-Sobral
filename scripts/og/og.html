<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">

*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#3f3f95;color:#fff;font-family:S;display:grid;grid-template-columns:1fr 440px;gap:40px;padding:56px 64px;overflow:hidden}
